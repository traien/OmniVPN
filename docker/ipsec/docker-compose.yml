# ==============================================================================
# OmniVPN: IPsec / IKEv2 VPN Server & Web Management Dashboard Compose Spec
# ==============================================================================

services:
  ipsec-vpn:
    image: hwdsl2/ipsec-vpn-server:latest
    container_name: ipsec-vpn-server
    restart: always
    privileged: true
    env_file:
      - ./vpn.env
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
    volumes:
      - /lib/modules:/lib/modules:ro
      - /etc/localtime:/etc/localtime:ro
      - ipsec-data:/etc/ipsec.d
      - ipsec-ppp:/etc/ppp
    networks:
      vpn-net:
        ipv4_address: 172.20.0.2

  vpn-webui:
    image: ghcr.io/traien/omnivpn-webui:latest
    container_name: vpn-webui
    restart: always
    env_file:
      - ./vpn.env
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ipsec-data:/etc/ipsec.d
      - ipsec-ppp:/etc/ppp
      - wireguard-data:/etc/wireguard
      - xray-data:/etc/xray
      - vpn-logs:/app/data
    networks:
      vpn-net:
        ipv4_address: 172.20.0.3
    depends_on:
      - ipsec-vpn
      - wireguard
      - xray

  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=${VPN_PUBLIC_IP}
      - SERVERPORT=51820
      - PEERS=0
      - PEERDNS=1.1.1.1
      - INTERNAL_SUBNET=10.8.0.0
      - ALLOWEDIPS=0.0.0.0/0
    ports:
      - "51820:51820/udp"
    volumes:
      - /lib/modules:/lib/modules:ro
      - wireguard-data:/config
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: always
    networks:
      vpn-net:
        ipv4_address: 172.20.0.4

  xray:
    image: teddysun/xray:latest
    container_name: xray
    restart: always
    ports:
      - "8388:8388/tcp"
      - "8388:8388/udp"
    volumes:
      - xray-data:/etc/xray
    networks:
      vpn-net:
        ipv4_address: 172.20.0.5

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  ipsec-data:
  ipsec-ppp:
  wireguard-data:
  xray-data:
  vpn-logs:
