name: omnivpn

services:
  ipsec-vpn:
    image: ${IPSEC_IMAGE:-hwdsl2/ipsec-vpn-server:latest}
    container_name: ipsec-vpn-server
    restart: unless-stopped
    privileged: true
    env_file: [.env]
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
    volumes:
      - /lib/modules:/lib/modules:ro
      - /etc/localtime:/etc/localtime:ro
      - ipsec-data:/etc/ipsec.d
      - ipsec-ppp:/etc/ppp
    networks:
      vpn-net:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD-SHELL", "ipsec status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  vpn-webui:
    build:
      context: ./webui
    image: omnivpn-webui:2.0.0
    container_name: vpn-webui
    restart: unless-stopped
    init: true
    env_file: [.env]
    ports:
      - "${WEBUI_BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - ipsec-data:/etc/ipsec.d
      - ipsec-ppp:/etc/ppp
      - wireguard-data:/etc/wireguard
      - xray-data:/etc/xray
      - vpn-logs:/app/data
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 20s
    networks:
      vpn-net:
        ipv4_address: 172.20.0.3
    depends_on:
      ipsec-vpn:
        condition: service_healthy
      wireguard:
        condition: service_started
      xray:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  wireguard:
    image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls120
    container_name: wireguard
    restart: unless-stopped
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: ${TZ:-Etc/UTC}
      SERVERURL: ${VPN_PUBLIC_IP}
      SERVERPORT: "51820"
      PEERS: "0"
      PEERDNS: "172.20.0.3"
      INTERNAL_SUBNET: "10.8.0.0"
      ALLOWEDIPS: "0.0.0.0/0"
    ports:
      - "51820:51820/udp"
    volumes:
      - /lib/modules:/lib/modules:ro
      - wireguard-data:/config
    sysctls:
      net.ipv4.conf.all.src_valid_mark: "1"
      net.ipv4.ip_forward: "1"
    security_opt:
      - no-new-privileges:true
    networks:
      vpn-net:
        ipv4_address: 172.20.0.4

  xray:
    image: teddysun/xray:26.7.28
    container_name: xray
    restart: unless-stopped
    ports:
      - "8388:8388/tcp"
      - "8388:8388/udp"
    volumes:
      - xray-data:/etc/xray
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      vpn-net:
        ipv4_address: 172.20.0.5

networks:
  vpn-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  ipsec-data:
  ipsec-ppp:
  wireguard-data:
  xray-data:
  vpn-logs:
